name: Update blog posts

on:
  schedule:
    # Runs at 13:00 UTC on the 1st and 15th of each month (~every 2 weeks)
    - cron: '0 13 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-blogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest Medium posts
        run: node scripts/update-blogs.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/assets/data/content.json; then
            echo "No new posts, nothing to commit."
            exit 0
          fi
          git add public/assets/data/content.json
          git commit -m "Update blog posts from Medium feed"
          git push
